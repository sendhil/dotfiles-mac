# Walker launcher configuration. Elephant supplies the provider data.
theme = "tokyo-night"
close_when_open = true
force_keyboard_focus = true
selection_wrap = true

[shell]
anchor_top = true
anchor_bottom = true
anchor_left = true
anchor_right = true

[placeholders]
"default" = { input = "Search apps, bookmarks, snippets, or clipboard", list = "No matches" }
"clipboard" = { input = "Search clipboard history", list = "Clipboard is empty" }
"snippets" = { input = "Search snippets", list = "No snippets found" }
"menus:chrome-bookmarks" = { input = "Search Chrome bookmarks", list = "No bookmarks found" }

[providers]
default = [
  "desktopapplications",
  "clipboard",
  "snippets",
  "menus:chrome-bookmarks",
]
empty = ["desktopapplications"]
max_results = 100

[providers.max_results_provider]
desktopapplications = 30
clipboard = 50
snippets = 50
"menus:chrome-bookmarks" = 100

[[providers.prefixes]]
prefix = ":"
provider = "clipboard"

[[providers.prefixes]]
prefix = ";"
provider = "providerlist"

[[providers.prefixes]]
prefix = "~"
provider = "snippets"

[[providers.prefixes]]
prefix = "?"
provider = "menus:chrome-bookmarks"

[keybinds]
close = ["Escape"]
next = ["Down", "ctrl j"]
previous = ["Up", "ctrl k"]
quick_activate = ["F1", "F2", "F3", "F4"]
